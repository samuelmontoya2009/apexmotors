<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ApexMotors - Registro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
    <div class="container">
      <a class="navbar-brand text-uppercase" href="index.html">🚗 Apex<span class="text-danger">Motors</span></a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Volver al Inicio</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container my-5" style="max-width: 600px;">
    <h2 class="text-danger text-center mb-4">Registro de Usuario</h2>
    <form class="card p-4 border-danger">
      <div class="mb-3">
        <label class="form-label">Nombre completo</label>
        <input type="text" class="form-control bg-secondary text-white border-0" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Documento de identificación</label>
        <input type="text" class="form-control bg-secondary text-white border-0" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Correo electrónico</label>
        <input type="email" class="form-control bg-secondary text-white border-0" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Usuario</label>
        <input type="text" class="form-control bg-secondary text-white border-0" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Contraseña</label>
        <input type="password" class="form-control bg-secondary text-white border-0" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Confirmación de contraseña</label>
        <input type="password" class="form-control bg-secondary text-white border-0" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Registrarse</button>
    </form>
  </div>

  <footer class="text-center py-4" style="color: var(--color-accent);"><p>&copy; 2026 ApexMotors.</p></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/jquery-4.0.0.min.js"></script>
  <script src="js/popper.min.js"></script>
  <script src="js/bootstrap.min.js"></script>
  <script src="js/funciones.js"></script>
</body>
</html>
